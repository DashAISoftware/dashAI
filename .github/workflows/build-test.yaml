name: Build and Test
on:
  # Feature branches are tested through their pull request. Running on every
  # push as well tested each commit twice (#1011).
  push:
    branches: [develop, production]
  pull_request:
  # Lets a branch without a pull request still run the suite by hand.
  workflow_dispatch:

# A new push to a pull request cancels its outdated run. Pushes to develop and
# production are never cancelled, so every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DashAI/front
    steps:
      - uses: actions/checkout@v3
      - name: Enable Corepack and use Yarn 3
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          cache: "yarn"
          cache-dependency-path: DashAI/front/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: DashAI/front/build
          retention-days: 7
      - run: yarn test --passWithNoTests

  pytest:
    needs: react-build-test
    runs-on: ${{ matrix.os }}
    # Without this a hung test holds the runner for GitHub's six hour default.
    # A limit still turns a deadlock into a red job with a readable log. Windows
    # now needs about thirty minutes for the suite and has started hitting the
    # old thirty minute limit (#1011), so sixty is a stopgap until it is faster.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJson('["3.11", "3.12", "3.13"]') || fromJson('["3.12"]') }}
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra cpu --no-install-package llama-cpp-python

      - name: Prepare frontend build
        run: mkdir -p DashAI/front/build

      - uses: actions/download-artifact@v4
        with:
          name: react-build
          path: DashAI/front/build
      - name: Test with pytest
        run: uv run --no-sync pytest -v
