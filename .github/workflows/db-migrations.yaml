name: DB Migrations

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  alembic-migrations:
    strategy:
      matrix:
        python-version: ["3.11"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the checks below read the migrations of previous
          # releases (tags) and of the base branch.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra cpu --no-install-package llama-cpp-python

      # A migration that already reached a release or the base branch must keep
      # its revision id and its parent; otherwise databases out there skip or
      # cannot locate revisions.
      - name: Check published migrations keep their parents
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          refs="$(git tag --sort=-creatordate | head -n 1)"
          if [ -n "$BASE_REF" ]; then
            refs="$refs origin/$BASE_REF"
          fi
          uv run --no-sync python scripts/ci_alembic_history.py check-parents $refs

      - name: Set DB env vars
        run: |
          echo "DB_FILE=$RUNNER_TEMP/dashai-ci.sqlite3" >> "$GITHUB_ENV"
          echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/dashai-ci.sqlite3" >> "$GITHUB_ENV"
          echo "Temp dir: $RUNNER_TEMP"

      - name: Show Alembic info
        run: |
          uv run --no-sync alembic --version
          echo "DB will be at: $DATABASE_URL"

      - name: Prepare temp dir
        run: |
          mkdir -p "$(dirname "$DB_FILE")"
          rm -f "$DB_FILE"

      # upgrade to head
      - name: Upgrade to head
        run: |
          uv run --no-sync alembic -x url="$DATABASE_URL" upgrade head

      # Checks downgrade and upgrade again (reversibility)
      - name: Downgrade to base and upgrade again (reversibility check)
        run: |
          uv run --no-sync alembic -x url="$DATABASE_URL" downgrade base
          uv run --no-sync alembic -x url="$DATABASE_URL" upgrade head

      - name: Check for pending autogenerate (python-based)
        env:
          PYTHONPATH: "${PYTHONPATH}:."
        run: uv run --no-sync python -m scripts.ci_alembic_check

      # A database created on each of the last releases must end up with the
      # same schema as one created from scratch.
      - name: Upgrade databases created on previous releases
        run: |
          uv run --no-sync python scripts/ci_alembic_history.py upgrade-from \
            $(git tag --sort=-creatordate | head -n 8)
