name: Docs
on:
  push:
    branches:
      - production
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            docs/requirements.txt

      - name: Install system build tools (gcc, g++, cmake, ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Build docs
        env:
          CC: gcc
          CXX: g++
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -U pip setuptools wheel scikit-build-core
          # Dependencias SOLO de docs
          pip install -r docs/requirements.txt
          # Instalación normal del proyecto (con todas las deps)
          pip install -e .
          # (opcional) limpia stubs viejos por si quedaron versionados
          rm -rf docs/source/api/generated || true
          # Construir HTML directamente (sin action)
          sphinx-build -b html docs/source docs/build/html

      - name: Setup Pages
        uses: actions/configure-pages@v2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/build/html"
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
