name: Docs
on:
  push:
    branches: [production, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installed into the system Python because the Docusaurus build
      # invokes `python scripts/generate_components.py` directly.
      - name: Install DashAI (needed for component introspection)
        run: uv pip install --system -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: docs/yarn.lock

      - name: Install Docusaurus dependencies
        run: yarn install --frozen-lockfile
        working-directory: docs

      - name: Build docs (generates components + Docusaurus build)
        run: yarn build
        working-directory: docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # One artifact name per attempt. Re-running the whole workflow keeps
      # the previous attempt's artifact on the run, and deploy-pages aborts
      # when it finds two artifacts with the same name ("Multiple artifacts
      # named github-pages were unexpectedly found").
      - name: Pick the artifact name
        id: artifact
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: "docs/build"
          retention-days: 1

  # Separate job so a failed deploy (Pages timing out, as on 2026-11-06)
  # can be re-run alone without rebuilding or re-uploading anything.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
