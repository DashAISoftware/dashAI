name: Build and Publish to PyPI

on:
  push:
    branches:
      - production

jobs:
  # ============================================================
  # 1. Frontend Build
  # ============================================================
  react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DashAI/front
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack and use Yarn 3
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "yarn"
          cache-dependency-path: DashAI/front/yarn.lock
      - name: Install and build
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: DashAI/front/build
          retention-days: 1
      - name: Run frontend tests
        run: yarn test --passWithNoTests

  # ============================================================
  # 2. Publish to PyPI
  # ============================================================
  publish-pypi:
    needs: react-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: DashAI/front/build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        run: python -m build

      - name: Verify frontend is included in wheel
        run: |
          if ! zipinfo dist/*.whl | grep -q 'DashAI/front/build'; then
            echo "Frontend files not found in the wheel package!"
            exit 1
          fi

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  # ============================================================
  # 3. Build Windows Executable
  # ============================================================
  build-windows-executable:
    needs: react-build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Download React build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: DashAI/front/build
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install pyinstaller
      - name: Build executable
        shell: cmd
        run: |
          pyinstaller --clean --noconfirm dashai.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/installer.iss
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: DashAI-windows-installer
          path: installer/DashAI-Installer.exe
          retention-days: 1

  # ============================================================
  # 4. Build macOS ARM64 Executable
  # ============================================================
  build-macos-arm64:
    needs: react-build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download React build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: DashAI/front/build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install pyinstaller
          pip install --force-reinstall llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          brew install create-dmg

      - name: Build ARM64 App Bundle
        run: |
          pyinstaller --clean --noconfirm dashai.spec

      - name: Sign App Bundle (ad-hoc)
        run: |
          codesign --force --deep --sign - dist/DashAI.app

      - name: Create DMG
        run: |
          rm -f DashAI-macos-arm64.dmg

          create-dmg \
            --volname "DashAI Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            --hide-extension "DashAI.app" \
            --no-internet-enable \
            "DashAI-macos-arm64.dmg" \
            "dist/DashAI.app"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashAI-dmg-arm64
          path: DashAI-macos-arm64.dmg
          retention-days: 1

  # ============================================================
  # 5. Build macOS x86_64 Executable
  # ============================================================
  build-macos-x86_64:
    needs: react-build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Download React build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: DashAI/front/build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install pyinstaller
          pip install --force-reinstall llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          brew install create-dmg

      - name: Build x86_64 App Bundle
        run: |
          pyinstaller --clean --noconfirm dashai.spec

      - name: Sign App Bundle (ad-hoc)
        run: |
          codesign --force --deep --sign - dist/DashAI.app

      - name: Create DMG
        run: |
          rm -f DashAI-macos-x86_64.dmg

          create-dmg \
            --volname "DashAI Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            --hide-extension "DashAI.app" \
            --no-internet-enable \
            "DashAI-macos-x86_64.dmg" \
            "dist/DashAI.app"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashAI-dmg-x86_64
          path: DashAI-macos-x86_64.dmg
          retention-days: 1

  # ============================================================
  # 6. Publish installers to GitHub Release
  # ============================================================
  github-release:
    needs:
      - publish-pypi
      - build-windows-executable
      - build-macos-arm64
      - build-macos-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from setup.py
        id: version
        run: |
          VERSION=$(grep -m 1 '    version=' setup.py | sed -E 's/.*version="([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: DashAI-windows-installer
          path: artifacts/windows

      - name: Download macOS ARM64 DMG
        uses: actions/download-artifact@v4
        with:
          name: DashAI-dmg-arm64
          path: artifacts/macos-arm64

      - name: Download macOS x86_64 DMG
        uses: actions/download-artifact@v4
        with:
          name: DashAI-dmg-x86_64
          path: artifacts/macos-x86_64

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/windows/DashAI-Installer.exe
            artifacts/macos-arm64/DashAI-macos-arm64.dmg
            artifacts/macos-x86_64/DashAI-macos-x86_64.dmg
